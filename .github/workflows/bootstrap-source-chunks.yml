name: Bootstrap source chunks

on:
  push:
    branches:
      - main
    paths:
      - bootstrap-source.ready
      - bootstrap-source.tar.gz.b64.part-*
      - .github/workflows/bootstrap-source-chunks.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for ready marker
        run: |
          test -f bootstrap-source.ready

      - name: Unpack generated source
        run: |
          cat bootstrap-source.tar.gz.b64.part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz -C .
          rm -f bootstrap-source.ready bootstrap-source.tar.gz.b64.part-*

      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add generated MVP source"
            git push
          fi
