name: Bootstrap source

on:
  push:
    branches:
      - main
    paths:
      - bootstrap-source.tar.gz.b64
      - .github/workflows/bootstrap-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack generated source
        if: ${{ hashFiles('bootstrap-source.tar.gz.b64') != '' }}
        run: |
          base64 -d bootstrap-source.tar.gz.b64 > /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz -C .
          rm bootstrap-source.tar.gz.b64

      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add generated MVP source"
            git push
          fi
